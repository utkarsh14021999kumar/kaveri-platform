name: wif-smoke-test

on:
  pull_request:
    paths:
      - ".github/workflows/wif-smoke-test.yml"
  workflow_dispatch:

# Least privilege for the workflow token; id-token is required for OIDC.
permissions:
  contents: read
  id-token: write

jobs:
  plan-identity:
    name: Plan identity - read OK, write denied
    runs-on: ubuntu-latest
    steps:
      - name: Preflight - required repository variables are set
        run: |
          for v in "${{ vars.GCP_WIF_PROVIDER }}" "${{ vars.GCP_PLAN_SA }}" "${{ vars.TF_STATE_BUCKET }}"; do
            [ -n "$v" ] || { echo "FAIL: a required repository variable is empty"; exit 1; }
          done
          echo "PASS: variables present"

      - name: Authenticate via WIF as the read-only plan identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read the state bucket (must succeed)
        run: gcloud storage ls "gs://${{ vars.TF_STATE_BUCKET }}/"

      - name: Write to the state bucket (must be DENIED by IAM)
        run: |
          echo "probe" > probe.txt
          if out=$(gcloud storage cp probe.txt "gs://${{ vars.TF_STATE_BUCKET }}/smoke-probe.txt" 2>&1); then
            echo "FAIL: plan identity was able to write"; exit 1
          fi
          echo "$out" | tail -3
          if echo "$out" | grep -qiE '403|denied|permission'; then
            echo "PASS: write denied by IAM - plan identity is read-only"
          else
            echo "FAIL: write failed for an unexpected reason"; exit 1
          fi

  deployer-denied-without-environment:
    name: Deployer without environment - must be DENIED
    runs-on: ubuntu-latest
    steps:
      - name: Preflight - required repository variables are set
        run: |
          for v in "${{ vars.GCP_WIF_PROVIDER }}" "${{ vars.GCP_DEPLOYER_SA }}"; do
            [ -n "$v" ] || { echo "FAIL: a required repository variable is empty"; exit 1; }
          done
          echo "PASS: variables present"

      - name: Configure WIF credentials for the deployer (no token minted yet)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Attempt to mint a deployer token (must be PERMISSION DENIED)
        run: |
          if out=$(gcloud auth print-access-token 2>&1); then
            echo "FAIL: obtained deployer credentials without environment dev"; exit 1
          fi
          echo "$out" | tail -5
          if echo "$out" | grep -qiE 'getAccessToken|PERMISSION_DENIED|403'; then
            echo "PASS: deployer denied by IAM outside environment dev"
          else
            echo "FAIL: denied for an unexpected reason - check the log above"; exit 1
          fi

  deployer-allowed-in-dev:
    name: Deployer in environment dev - must succeed
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Preflight - required repository variables are set
        run: |
          for v in "${{ vars.GCP_WIF_PROVIDER }}" "${{ vars.GCP_DEPLOYER_SA }}" "${{ vars.GCP_PROJECT_ID }}"; do
            [ -n "$v" ] || { echo "FAIL: a required repository variable is empty"; exit 1; }
          done
          echo "PASS: variables present"

      - name: Debug - show OIDC token claims (token itself is never printed)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/${{ vars.GCP_WIF_PROVIDER }}")
          echo "$RESP" | python3 -c '
          import sys, json, base64
          tok = json.load(sys.stdin)["value"]
          p = tok.split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ["sub","repository_id","repository_owner_id","environment","ref","event_name"]}, indent=2))
          '

      - name: Authenticate via WIF as the deployer
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read project metadata as the deployer
        run: gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format="value(projectId,projectNumber)"
