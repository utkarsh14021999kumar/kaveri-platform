name: terraform-pr

on:
  pull_request:

# Workflow token: read-only by default; jobs elevate only what they need.
permissions:
  contents: read

# A new push to the same PR cancels the older run.
concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Diff against the base branch
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^(platform-infra/terraform/|\.github/workflows/terraform-pr\.yml$)'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"; echo "Terraform changes detected"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"; echo "No Terraform changes - Terraform jobs will be skipped"
          fi

  static:
    name: Static checks (fmt, validate, TFLint, Checkov, Gitleaks)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff platform-infra/terraform

      - name: terraform validate (roots with committed lock files)
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in platform-infra/terraform/bootstrap platform-infra/terraform/environments/dev; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -lockfile=readonly -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

      - name: terraform validate (modules)
        run: |
          set -euo pipefail
          for d in platform-infra/terraform/modules/*/; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

      - name: Module tests (terraform test, mock provider)
        run: |
          set -e
          for d in platform-infra/terraform/modules/*/; do
            if ls "$d"tests/*.tftest.hcl >/dev/null 2>&1; then
              echo "== $d"; terraform -chdir="$d" init -backend=false -input=false >/dev/null; terraform -chdir="$d" test
            fi
          done
      - name: TFLint
        run: |
          docker run --rm -v "$PWD:/data" -w /data/platform-infra/terraform \
            ghcr.io/terraform-linters/tflint@sha256:65b9944a9274c4989492c1d79998c2801664bf8a55fddb4bd3a9e6d73a006ddc --recursive --format compact

      - name: Checkov (new findings fail; known findings in .checkov.baseline)
        run: |
          docker run --rm -v "$PWD:/tf" bridgecrew/checkov@sha256:cc0031f5ea22e351f8d19d2b7cff8a924034e4a044e1a91e96e0012d6baa8b8d \
            -d /tf/platform-infra/terraform --framework terraform \
            --baseline /tf/platform-infra/terraform/.checkov.baseline --compact --quiet

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact

  plan-dev:
    name: Plan DEV (read-only identity)
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_DIR: platform-infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate via WIF as the read-only plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - name: terraform init (GCS backend, committed lock file)
        run: terraform -chdir="$TF_DIR" init -lockfile=readonly -no-color

      - name: terraform plan (no state lock - read-only identity)
        run: |
          set -o pipefail
          terraform -chdir="$TF_DIR" plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Render plan
        run: terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt

      - name: Policy check (Conftest on plan JSON)
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > "$TF_DIR/plan.json"
          docker run --rm -v "$PWD:/w" -w /w openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 verify -p policy/terraform --no-color
          docker run --rm -v "$PWD:/w" -w /w openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 test "$TF_DIR/plan.json" -p policy/terraform --no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-dev-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            plan.txt
          retention-days: 5

      - name: Comment plan summary on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          SUMMARY=$(grep -E '^Plan:|^No changes' plan.txt | head -1)
          {
            echo "### Terraform plan - environments/dev"
            echo "Commit ${SHA:0:7} - identity: read-only plan SA - state lock: not taken"
            echo
            echo "**${SUMMARY:-no summary found}**"
            echo
            echo "Resource actions (addresses only):"
            echo
            grep -E '^  # ' plan.txt | sed 's/^  # /    /' | head -150
            echo
            echo "Full plan: artifact tfplan-dev-pr${PR}-${SHA} (5-day retention)."
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
