name: dev-pause

# Operational pause of DEV compute (ADR-0006 short-burst).
# Pause = this workflow (approval). Resume = terraform-apply-dev with apply=true (restores autoscaling).
# v2 (#61): waits for the cluster autoscaler to drop the old config (P2-9), verifies real VMs (P2-8).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status (read-only) or pause (scale node pool to 0; approval required)"
        type: choice
        options: [status, pause]
        default: status

permissions:
  contents: read

# Same group as terraform-apply-dev: a pause can never overlap an apply.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  CLUSTER: kaveri-dev-gke
  ZONE: asia-south1-a
  POOL: kaveri-dev-system-pool

jobs:
  status:
    name: DEV compute status (read-only identity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate via WIF as the read-only plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Show node pool state (instance group = source of truth)
        run: |
          MIG=$(gcloud container node-pools describe "$POOL" --cluster "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
                --format='value(instanceGroupUrls[0].basename())')
          gcloud container node-pools describe "$POOL" --cluster "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
            --format='table(name,status,autoscaling.enabled,autoscaling.minNodeCount,autoscaling.maxNodeCount)'
          SIZE=$(gcloud compute instance-groups managed describe "$MIG" --zone "$ZONE" --project "$PROJECT" --format='value(targetSize)')
          echo "instance group $MIG targetSize=$SIZE"
          echo "### DEV compute status: targetSize=$SIZE" >> "$GITHUB_STEP_SUMMARY"

  pause:
    name: Pause DEV compute (deployer, approval required)
    needs: status
    if: inputs.action == 'pause'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate via WIF as the deployer (environment dev only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Disable autoscaling, then wait for the autoscaler to drop the old config (P2-9)
        run: |
          set -euo pipefail
          gcloud container clusters update "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
            --node-pool "$POOL" --no-enable-autoscaling --quiet
          echo "autoscaling disabled; waiting 120 s so the cluster autoscaler stops acting on the old 1-2 range"
          sleep 120

      - name: Resize to 0 and wait until no node VMs remain (one retry)
        run: |
          set -euo pipefail
          PREFIX=$(gcloud container node-pools describe "$POOL" --cluster "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
                   --format='value(instanceGroupUrls[0].basename())' | sed 's/-grp$//')
          count() { gcloud compute instances list --project "$PROJECT" --zones "$ZONE" --filter="name~^${PREFIX}" --format='value(name)' | wc -l; }
          ok=0
          for attempt in 1 2; do
            echo "attempt $attempt: resize to 0"
            gcloud container clusters resize "$CLUSTER" --zone "$ZONE" --project "$PROJECT" --node-pool "$POOL" --num-nodes 0 --quiet
            for i in $(seq 1 60); do
              n=$(count); echo "t=$((i*10))s node VMs=$n"
              if [ "$n" -eq 0 ]; then sleep 20; if [ "$(count)" -eq 0 ]; then ok=1; break; fi; fi
              sleep 10
            done
            if [ "$ok" -eq 1 ]; then break; fi
          done
          if [ "$ok" -ne 1 ]; then echo "FAIL: node VMs remain after 2 attempts"; exit 1; fi
          echo "attempts used: $attempt" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify pause (read-only identity)
    needs: pause
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate via WIF as the read-only plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Instance group targetSize=0, stable, and no node VMs (P2-8)
        run: |
          set -euo pipefail
          MIG=$(gcloud container node-pools describe "$POOL" --cluster "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
                --format='value(instanceGroupUrls[0].basename())')
          SIZE=$(gcloud compute instance-groups managed describe "$MIG" --zone "$ZONE" --project "$PROJECT" --format='value(targetSize)')
          STABLE=$(gcloud compute instance-groups managed describe "$MIG" --zone "$ZONE" --project "$PROJECT" --format='value(status.isStable)')
          VMS=$(gcloud compute instances list --project "$PROJECT" --zones "$ZONE" --filter="name~^${MIG%-grp}" --format='value(name)' | wc -l)
          echo "targetSize=$SIZE stable=$STABLE nodeVMs=$VMS"
          if [ "$SIZE" != "0" ] || [ "$STABLE" != "True" ] || [ "$VMS" -ne 0 ]; then echo "FAIL: DEV compute not paused"; exit 1; fi
          {
            echo "### DEV compute paused (verified read-only)"
            echo "targetSize=0, stable, no node VMs. Resume: terraform-apply-dev with apply=true."
          } >> "$GITHUB_STEP_SUMMARY"
