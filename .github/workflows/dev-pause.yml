name: dev-pause

# Operational pause of DEV compute (ADR-0006 short-burst).
# Pause = this workflow (approval). Resume = terraform-apply-dev with apply=true (restores autoscaling).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status (read-only) or pause (scale node pool to 0; approval required)"
        type: choice
        options: [status, pause]
        default: status

permissions:
  contents: read

# Same group as terraform-apply-dev: a pause can never overlap an apply.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  CLUSTER: kaveri-dev-gke
  ZONE: asia-south1-a
  POOL: kaveri-dev-system-pool

jobs:
  status:
    name: DEV compute status (read-only identity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate via WIF as the read-only plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Show node pool state
        run: |
          gcloud container node-pools describe "$POOL" --cluster "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
            --format='table(name,status,autoscaling.enabled,autoscaling.minNodeCount,autoscaling.maxNodeCount)'
          n=$(gcloud container clusters describe "$CLUSTER" --zone "$ZONE" --project "$PROJECT" --format='value(currentNodeCount)')
          echo "current nodes: ${n:-0}"
          echo "### DEV compute status: ${n:-0} node(s)" >> "$GITHUB_STEP_SUMMARY"

  pause:
    name: Pause DEV compute (deployer, approval required)
    needs: status
    if: inputs.action == 'pause'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate via WIF as the deployer (environment dev only)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Disable autoscaling and scale the node pool to 0
        run: |
          set -euo pipefail
          gcloud container clusters update "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
            --node-pool "$POOL" --no-enable-autoscaling --quiet
          gcloud container clusters resize "$CLUSTER" --zone "$ZONE" --project "$PROJECT" \
            --node-pool "$POOL" --num-nodes 0 --quiet

      - name: Verify 0 nodes
        run: |
          n=$(gcloud container clusters describe "$CLUSTER" --zone "$ZONE" --project "$PROJECT" --format='value(currentNodeCount)')
          echo "current nodes: ${n:-0}"
          if [ "${n:-0}" -ne 0 ]; then echo "FAIL: nodes still running"; exit 1; fi
          {
            echo "### DEV compute paused"
            echo "Node pool $POOL scaled to 0, autoscaling disabled."
            echo "Resume: run terraform-apply-dev with apply=true (restores autoscaling 1-2)."
          } >> "$GITHUB_STEP_SUMMARY"
